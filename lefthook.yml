pre-commit:
  parallel: false
  jobs:
    - name: lint staged code
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx --bun oxlint --fix {staged_files}
      stage_fixed: true
    - name: format staged files
      run: bunx --bun oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # Codegen keys its types by the exact query text, so it has to run after formatting reflows it.
    - name: regenerate GraphQL types
      glob: "apps/daemon/src/github/ops.ts"
      run: cd apps/daemon && bun run codegen && git add src/github/gql

pre-push:
  parallel: true
  commands:
    format:
      run: bun run format:check
    lint:
      run: bun run lint
    types:
      run: bun run typecheck
    test:
      run: bun test
